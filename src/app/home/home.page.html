<ion-content class="home">
  <div class="home-wrapper">

    <!-- Header -->
    <div class="header-card">
      <div class="app-badge">OPE Osakidetza 2026</div>
      <div class="title">
        <h1>T.S Organizacion</h1>
        <p>Prepara tu examen con preguntas reales</p>
      </div>
    </div>

    <!-- Botones de temario -->
    <div class="temario">

      <ion-button class="temario-card"
        [routerLink]="['/tabs/quiz']"
        [queryParams]="{ mode: 'general' }"
        shape="round">
        <div class="card-inner">
          Temario General
        </div>
      </ion-button>

      <ion-button class="temario-card"
        [routerLink]="['/tabs/quiz']"
        [queryParams]="{ mode: 'specific' }"
        shape="round">
        <div class="card-inner">
          Temario Específico
        </div>
      </ion-button>

      <ion-button class="temario-card"
        [routerLink]="['/tabs/quiz']"
        [queryParams]="{ mode: 'combined' }"
        shape="round">
        <div class="card-inner">
          Temario Conjunto
        </div>
      </ion-button>

    </div>

    <!-- Elegir por bloques de 50 -->
    <div class="blocks">
      <div class="blocks-title">Elegir por bloques de {{ blockSize }}</div>

      <div class="blocks-row" *ngFor="let g of blockGroups">
        <span class="blocks-type">{{ g.type }}</span>
        <div class="blocks-chips">
          <ion-chip *ngFor="let b of g.blocks"
            [class.all]="b.selected"
            (click)="b.selected = !b.selected">
            {{ b.start }}–{{ b.end }}
          </ion-chip>
        </div>
      </div>

      <div class="blocks-actions">
        <a *ngIf="selectedCount > 0" (click)="clearBlocks()">Limpiar</a>
        <ion-button shape="round" [disabled]="selectedCount === 0" (click)="startBlocks()">
          Empezar ({{ selectedCount }})
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
